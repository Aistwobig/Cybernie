# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: My 6ADET final project.
publish_to: "none"
version: 1.0.0+1
 
environment:
  sdk: ^3.8.0
 
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1
  # Custom fonts (used for the CYBERNIE title/subtitle/CTA text styles).
  google_fonts: ^6.2.1
  # Lets you use real SVG assets (e.g. the fleur-de-lis icon) instead ofq
  # built-in Material icons.
  flutter_svg: ^2.0.10+1
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  flame: ^1.38.2
  audioplayers: ^6.8.1
  web: ^1.1.1
  qr_flutter: ^4.1.0
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
 
flutter:
  uses-material-design: true
  # Put images, fonts and sounds in assets/ and list them here, for example:
  assets:
    - assets/images/
    - assets/audio/
  # Pixel font for in-game name plates (Press Start 2P, SIL Open Font
  # License: assets/fonts/PressStart2P-OFL.txt).
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
 