<!DOCTYPE html>
<html>
<head>
  <!-- $FLUTTER_BASE_HREF is replaced at build time by the --base-href flag in
       the deploy workflow. Leave it exactly as it is, or your deployed site
       loads a blank white page. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cybernie: a cozy multiplayer pixel-art tavern to hang out in with friends.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2A1408">

  <!-- The browser tab's title and icon. -->
  <title>Cybernie</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Added to an iPhone or iPad home screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cybernie">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
